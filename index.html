<!doctype html>
<html lang="en" style="background-color: #070709; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Secure bank receipt verification platform for Ethiopian banks and wallets with real-time QR code scanning and fraud detection." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BeuVerify" />
    <title>Beu Verify - Smart Bank Receipt &amp; SMS Verification</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070709" />
    <style>
      html, body {
        background-color: #070709 !important;
        color: #ffffff !important;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
        });
      }
    </script>
    <script>
      // Gracefully silence and intercept benign Vite HMR/WebSocket connection errors
      (function() {
        if (typeof window !== 'undefined') {
          const isBenign = (msg) => {
            if (!msg) return false;
            const s = msg.toLowerCase();
            return s.includes('websocket') || s.includes('ws://') || s.includes('vite') || s.includes('hmr');
          };
          
          window.addEventListener('unhandledrejection', (event) => {
            const reason = event.reason;
            const msg = reason?.message || reason?.toString() || '';
            if (isBenign(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', (event) => {
            const msg = event.message || event.error?.message || '';
            if (isBenign(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          // Monkey patch WebSocket to prevent unhandled background errors
          const OriginalWS = window.WebSocket;
          if (OriginalWS) {
            const PatchedWS = function(url, protocols) {
              try {
                const ws = new OriginalWS(url, protocols);
                ws.addEventListener('error', (e) => {
                  e.preventDefault();
                  e.stopImmediatePropagation();
                });
                return ws;
              } catch (err) {
                console.warn("Interceded WebSocket creation:", err);
                return {
                  addEventListener: () => {},
                  removeEventListener: () => {},
                  send: () => {},
                  close: () => {},
                  readyState: 3 // CLOSED
                };
              }
            };
            PatchedWS.prototype = OriginalWS.prototype;
            // Copy static properties if any
            for (const key in OriginalWS) {
              if (Object.prototype.hasOwnProperty.call(OriginalWS, key)) {
                PatchedWS[key] = OriginalWS[key];
              }
            }
            window.WebSocket = PatchedWS;
          }
        }
      })();
    </script>
  </head>
  <body style="background-color: #070709; color: #ffffff; margin: 0; padding: 0;">
    <div id="root">
      <div style="min-height: 100vh; background-color: #070709; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; color: #ffffff;">
        <div style="width: 44px; height: 44px; border: 3px solid #FFD700; border-top-color: transparent; border-radius: 50%; animation: beuSpin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <p style="font-size: 12px; color: #888899; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin: 0;">Beu Verify Platform</p>
      </div>
      <style>
        @keyframes beuSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
